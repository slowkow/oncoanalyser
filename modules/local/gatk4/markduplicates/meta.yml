name: gatk4_markduplicates
description: Mark duplicate reads in RNA alignments, writing the BAM, its index and the metrics into one directory
keywords:
  - markduplicates
  - bam
  - rna
tools:
  - gatk4:
      description:
        Developed in the Data Sciences Platform at the Broad Institute, the toolkit offers a wide variety of tools
        with a primary focus on variant discovery and genotyping. Its powerful processing engine
        and high-performance computing features make it capable of taking on projects of any size.
      homepage: https://gatk.broadinstitute.org/hc/en-us
      documentation: https://gatk.broadinstitute.org/hc/en-us/articles/360037052812-MarkDuplicates-Picard-
      tool_dev_url: https://github.com/broadinstitute/gatk
      doi: 10.1158/1538-7445.AM2017-3590
      licence: ["MIT"]
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [id: 'sample_id']
  - bams:
      type: list
      description: Coordinate sorted BAM file(s)
      pattern: "*.{bam}"
output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [id: 'sample_id']
  - gatk4_markduplicates_dir:
      type: directory
      description: Directory with <sample_id>.md.bam, <sample_id>.md.bam.bai and <sample_id>.md.metrics
  - command_files:
      type: list
      description: List of command files
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@ajodeh-juma"
  - "@FriederikeHanssen"
  - "@maxulysse"
